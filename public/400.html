<!doctype html>
<html lang="de">
  <head>
    <title>Ungültige Anfrage (400) · Probiert</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      /* Statische Fehlerseite: greift, wenn ein Request die Applikation gar
         nicht erreicht. Deshalb ohne Stylesheets, Schriften oder Bilder von
         aussen; Farben wie in app/assets/stylesheets/application.css. */
      *, *::before, *::after { box-sizing: border-box; }
      html { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #ebe5d5;
        background:
          radial-gradient(circle at 20px 30px, #fff 0 1px, transparent 1.6px) 0 0 / 230px 230px,
          radial-gradient(circle at 140px 90px, #cfe6ff 0 1px, transparent 1.6px) 0 0 / 310px 310px,
          radial-gradient(circle at 90px 180px, #ffe3c2 0 1.3px, transparent 2px) 0 0 / 410px 410px,
          radial-gradient(ellipse 55% 45% at 92% -8%, rgba(255, 138, 61, 0.3), transparent 70%) no-repeat,
          radial-gradient(ellipse 45% 40% at 0% 100%, rgba(164, 148, 255, 0.2), transparent 70%) no-repeat,
          #060917;
      }
      main { max-width: 34rem; text-align: center; }
      .code {
        font: 700 clamp(4rem, 18vw, 7rem)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: -0.04em;
        background: linear-gradient(180deg, #fff1c9, #ffc247 45%, #ff8a3d);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 18px rgba(255, 138, 61, 0.45));
      }
      h1 {
        margin: 1rem 0 0.75rem;
        font: 700 1.05rem/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #ff8a3d;
      }
      p { margin: 0 0 0.75rem; }
      .flavor { color: #8e97c0; font-style: italic; }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        border: 1px solid #ffa05c;
        border-radius: 3px;
        background: linear-gradient(180deg, #ffa45e, #f2711f);
        color: #1b0d03;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 6px 18px -8px rgba(255, 138, 61, 0.8);
      }
      a:focus-visible { outline: 2px solid #72d5ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">400</div>
      <h1>Die Anfrage war fehlerhaft</h1>
      <p>Der Server konnte die Anfrage nicht verarbeiten. Lade die Seite neu oder versuche es später noch einmal.</p>
      <p class="flavor">Das Signal kam verrauscht an – wie ein Funkspruch aus Dark Bramble.</p>
      <a href="/">Zur Produktsuche</a>
    </main>
  </body>
</html>
