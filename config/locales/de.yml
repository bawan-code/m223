      product: { one: "Produkt", other: "Produkte" }
      rating: { one: "Bewertung", other: "Bewertungen" }
      report: { one: "Meldung", other: "Meldungen" }
    attributes:
      user:
        name: "Name"
        email_address: "E-Mail"
        unconfirmed_email: "Neue E-Mail"
        password: "Passwort"
        password_confirmation: "Passwort wiederholen"
        role: "Rolle"
        roles:
          benutzer: "Benutzer"
          moderator: "Moderator"
          administrator: "Administrator"
      category:
        name: "Name"
      retail_chain:
        name: "Name"
      product:
        name: "Bezeichnung"
        brand: "Marke"
        name_normalized: "Bezeichnung"
        description: "Beschreibung"
        category: "Kategorie"
        retail_chain: "Handelskette"
      rating:
        stars: "Sterne"
        comment: "Kommentar"
        product: "Produkt"
        user_id: "Bewertung"
      report:
        reason: "Grund"
