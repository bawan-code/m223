        statuses:
          offen: "Offen"
          in_bearbeitung: "In Bearbeitung"
          freigegeben: "Freigegeben"
          gesperrt: "Gesperrt"
        rating: "Bewertung"
        reporter_id: "Meldung"
    errors:
      models:
        product:
          attributes:
            name_normalized:
              already_exists: "gibt es bei dieser Kette und Marke bereits"
        rating:
          attributes:
            user_id:
              already_rated: "für dieses Produkt gibt es von dir bereits"
            product:
              locked: "ist gesperrt und kann nicht bewertet werden"
        report:
          attributes:
            reporter_id:
              already_reported: "hast du für diese Bewertung bereits abgeschickt"
            rating:
              own_rating: "kannst du nicht melden, sie stammt von dir"
